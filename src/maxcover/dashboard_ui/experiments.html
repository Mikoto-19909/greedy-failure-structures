<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Greedy · 实验配置</title><link rel="icon" href="/favicon.svg" />
  <link rel="stylesheet" href="/styles.css" /><link rel="stylesheet" href="/workbench.css" /><link rel="stylesheet" href="/experiments.css" />
</head>
<body>
  <header class="topbar wb-topbar"><div class="brand-lockup"><div class="brand-mark" aria-hidden="true">MC</div><div>
    <p class="eyebrow">MAXIMUM COVERAGE</p><h1>实验配置</h1></div></div>
    <div class="wb-actions"><a href="/workbench" class="button button-secondary">实验库与主题分组 ↗</a><a href="/research" class="button button-primary">运行中心 ↗</a></div>
  </header>
  <main class="wb-shell config-shell">
    <div class="wb-heading"><div><p class="section-kicker">复制 → 编辑 → 预览 → 运行</p><h2>为下一个实验准备配置</h2>
      <p class="lede">从已有模板创建本地副本，核对参数与规模，再到运行中心排队。</p></div></div>
    <p id="config-message" role="status" aria-live="polite"></p>
    <div class="wb-toolbar"><label>已有模板与本地配置<select id="config-select" class="field"><option value="">正在读取…</option></select></label>
      <button id="config-refresh" class="button button-secondary">刷新列表</button><button id="config-reload" class="button button-secondary" disabled>重新载入所选配置</button>
      <button id="config-copy" class="button button-primary" disabled>复制为本地配置</button></div>
    <section id="config-editor" hidden>
      <p id="config-source" class="help-text"></p><p id="config-permission" class="wb-note"></p>
      <div class="config-fields"><label>实验名称<input id="config-name" class="field" /></label>
        <label>基础种子<input id="config-seed" class="field" inputmode="numeric" /></label>
        <label>重复次数<input id="config-repetitions" class="field" inputmode="numeric" /></label></div>
      <div class="wb-actions"><button id="config-apply" class="button button-secondary">应用基本参数并预览</button></div>
      <label class="config-json-label">完整配置 JSON<textarea id="config-text" class="field" spellcheck="false" rows="22"></textarea></label>
      <p class="help-text">案例、算法与扫描参数可在 JSON 中修改；种子以整数文本保留。基本参数修改后请先点击“应用基本参数并预览”。</p>
      <div class="wb-actions"><button id="config-preview" class="button button-secondary">校验 JSON 与比较差异</button>
        <button id="config-save" class="button button-primary">保存本地配置</button><a id="config-run" href="/research" class="button button-secondary">到运行中心排队 ↗</a></div>
      <section class="config-preview" aria-labelledby="config-plan-title"><h3 id="config-plan-title">规模预览</h3><p id="config-plan"></p><p id="config-warnings" class="help-text"></p></section>
      <section><h3>相对已保存配置的参数差异</h3><div id="config-changes" class="config-diffs"></div></section>
      <details><summary>相对复制时原模板的差异</summary><div id="config-origin-changes" class="config-diffs"></div></details>
    </section>
  </main><script src="/experiments.js"></script>
</body></html>
