<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>专题分析 · 本地研究工作台</title><link rel="stylesheet" href="/study-analysis.css"></head>
<body><header><a href="/research">← 专题研究</a><a href="/workbench">实验库</a><span>本地研究工作台</span></header>
<main><h1 id="title">专题分析</h1><p id="source"></p><p id="notice" class="note"></p><p id="message" role="status" aria-live="polite"></p>
<section><h2>范围与统计单位</h2><div class="controls" id="dimensions"><label>全集 n<select id="n"></select></label><label>集合大小 d<select id="d"></select></label><label>预算 k<select id="k"></select></label></div><p id="counts"></p><p id="unit"></p><div id="primary"></div></section>
<section id="curve-section"><h2>保存的预算曲线</h2><label>指标<select id="curve-metric"></select></label><p>点击曲线上的点进入该预算。区间使用保存的逐点区间；不用于事后挑峰推断。</p><div id="curve" class="chart"></div></section>
<section><h2>分布与同图比较</h2><label>分布指标<select id="distribution-metric"></select></label><p id="distribution-summary"></p><div id="distribution" class="chart"></div><div id="paired-summary"></div><div id="pair-table" class="scroll"></div></section>
<section id="budget-pairs"><h2>R2 同原图跨预算配对</h2><div class="controls"><label>预算 A<select id="k-a"></select></label><label>预算 B<select id="k-b"></select></label><label>差值指标<select id="pair-metric"><option value="relative_gap">相对损失</option><option value="absolute_loss">绝对损失</option><option value="greedy">Greedy 覆盖</option><option value="optimum">最优覆盖</option></select></label><button id="compare-pairs">比较 B − A</button></div><p id="budget-pair-message"></p><div id="budget-pair-chart" class="chart"></div><div id="budget-pair-table" class="scroll"></div></section>
<section><div class="heading"><h2>完整记录浏览</h2><label><input id="loss-only" type="checkbox"> 仅显示 G &lt; O</label></div><p>筛选影响当前分布与明细。R3 配对仍使用入选原图的全部四端点；完整批次主区间保持原设计。</p><div id="records" class="scroll"></div><div class="controls"><button id="previous">上一页</button><span id="page-count"></span><button id="next">下一页</button></div></section>
<section id="instance-panel" hidden><div class="heading"><h2 id="instance-title">实例</h2><a id="export" class="button" download>下载可回放 JSON</a></div><p id="instance-source"></p><div id="instance-choices" class="controls"></div><p id="quality"></p><div class="controls"><button id="step-back">上一步</button><input id="step" type="range" min="0" value="0" aria-label="Greedy 步骤"><button id="step-next">下一步</button><span id="step-count"></span></div><p id="step-info"></p><div id="matrix" class="scroll"></div><p id="witnesses"></p><details id="certificate-panel"><summary>保存的前缀证书</summary><pre id="certificate"></pre></details><details id="moves-panel"><summary>原图到端点的已保存交换步骤</summary><p>每行：提案序号、集合 i、集合 j、元素 a、元素 b；交换保留集合大小和元素频数。</p><pre id="moves"></pre></details></section>
</main><script src="/study-analysis.js"></script></body></html>
