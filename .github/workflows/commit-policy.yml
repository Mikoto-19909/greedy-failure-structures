name: commit policy

# Enforces the two commit rules CONTRIBUTING.md declares: evidence-backed
# quantitative claims stay in tracked research documents rather than commit
# messages, and commits carry no AI attribution.
#
# content-boundary.yml scans tracked file content and never reads git history.
# This workflow remains separate because it reads commit history, with different
# inputs and a different failure mode.
#
# No paths: filter. A commit message is checked regardless of which files the
# commit touches, so a path filter could only skip commits that need checking.

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: commit-policy-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  commit-messages:
    name: commit messages and authorship
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # fetch-depth: 0 rather than the default 1. The default fetches a single
      # commit, so every commit under review except the tip would be invisible
      # and the check would report success over a range it never read.
      - name: Check out repository with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # The workflow resolves the range because it is what knows the event
      # shape; the script only has to be correct about the range it receives.
      #
      # pull_request: base.sha..head.sha. The checkout is a merge commit whose
      # message is generated by GitHub, so checking HEAD would report on a
      # commit no contributor wrote. head.sha is the real branch tip.
      #
      # push: github.event.before..github.sha. `before` is the all-zeros null
      # SHA on a branch's first push; the script treats that as "no usable
      # base" and checks the tip, and the pull request then re-checks the whole
      # base..head range.
      #
      # workflow_dispatch: neither is set, so both are empty and the script
      # falls back to the tip.
      #
      # Passed through env rather than interpolated into the shell, so no
      # context value can be parsed as part of the command.
      - name: Check the commit rules over the range under review
        env:
          POLICY_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          POLICY_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >-
          python .github/scripts/check_commits.py
          --base "$POLICY_BASE"
          --head "$POLICY_HEAD"
